blueprint:
  name: AWTRIX NG - Consommation électrique TC002 (icône animée)
  description: >-
    Application persistante de consommation électrique pour AWTRIX NG. Elle est publiée au
    démarrage de Home Assistant, lors des changements de capteurs et périodiquement afin de
    garantir que l’application reste présente même sans changement des capteurs. Comprend
    un mode test et trois zones de couleur. Utilise l’icône animée lightningbolt installée sur le TC002.
  domain: automation
  author: ML

  input:
    device_filter:
      name: Filtre des appareils
      description: Choisissez de limiter la sélection au fabricant Blueforcer ou d’autoriser tous les appareils MQTT.
      default:
        active_choice: Blueforcer uniquement
        Blueforcer uniquement: {}
        Tous les appareils MQTT: {}
      selector:
        choose:
          choices:
            Blueforcer uniquement:
              selector:
                device:
                  integration: mqtt
                  manufacturer: Blueforcer
                  multiple: false
            Tous les appareils MQTT:
              selector:
                device:
                  integration: mqtt
                  multiple: false

    power_entity:
      name: Capteur de puissance (W)
      description: Entité numérique mesurant la puissance électrique actuelle en watts.
      selector:
        entity:
          domain: sensor

    percentage_entity:
      name: Capteur du pourcentage de consommation
      description: Entité numérique exprimant la consommation en pourcentage de la limite.
      selector:
        entity:
          domain: sensor

    test_mode:
      name: Mode test
      description: >-
        Activez-le pour simuler 0, 25, 50, 75 et 100 %, avec un changement toutes les 5 secondes.
        À 100 %, l’alerte sonore est également testée si elle est activée.
      default: false
      selector:
        boolean: {}

    app_name:
      name: Nom de l’application
      description: Nom fixe de l’application persistante dans la rotation AWTRIX NG.
      default: ha_consommation_electrique
      selector:
        text: {}

    low_threshold:
      name: Seuil entre vert et jaune (%)
      default: 70
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

    high_threshold:
      name: Seuil entre jaune et rouge (%)
      default: 90
      selector:
        number:
          min: 0
          max: 200
          step: 1
          unit_of_measurement: "%"
          mode: box

    bar_height:
      name: Hauteur de la barre de progression
      description: >-
        Hauteur en pixels de la barre intérieure, sans la bordure. Le cadre extérieur
        ajoute une bordure de 1 px en haut et en bas ; la hauteur totale sera donc la
        hauteur sélectionnée plus 2 px. Plage : 1 à 6 px.
      default: 4
      selector:
        number:
          min: 1
          max: 6
          step: 1
          unit_of_measurement: px
          mode: slider

    low_color:
      name: Couleur de la zone verte
      default:
        active_choice: Palette RGB
        Palette RGB: [0, 200, 60]
        Hexadécimal: "#00C83C"
      selector:
        choose:
          choices:
            Palette RGB:
              selector:
                color_rgb: {}
            Hexadécimal:
              selector:
                text: {}

    medium_color:
      name: Couleur de la zone jaune
      default:
        active_choice: Palette RGB
        Palette RGB: [255, 190, 0]
        Hexadécimal: "#FFBE00"
      selector:
        choose:
          choices:
            Palette RGB:
              selector:
                color_rgb: {}
            Hexadécimal:
              selector:
                text: {}

    high_color:
      name: Couleur de la zone rouge
      default:
        active_choice: Palette RGB
        Palette RGB: [255, 30, 30]
        Hexadécimal: "#FF1E1E"
      selector:
        choose:
          choices:
            Palette RGB:
              selector:
                color_rgb: {}
            Hexadécimal:
              selector:
                text: {}

    blink_on_overload:
      name: Faire clignoter le texte à partir de 100 %
      default: true
      selector:
        boolean: {}

    text_blink_ms:
      name: Vitesse du clignotement (ms)
      default: 600
      selector:
        number:
          min: 100
          max: 5000
          step: 100
          unit_of_measurement: ms
          mode: slider

    sound_alert_enabled:
      name: Activer l’alarme au franchissement de 100 %
      description: Déclenche l’alarme lorsque la consommation passe de moins de 100 % à 100 % ou plus, ou atteint 100 % en mode test.
      default: true
      selector:
        boolean: {}

    alert_mode:
      name: Type d’alarme
      description: >-
        Choisissez une sirène ou une voix anglaise. AWTRIX NG remplace une alerte déjà
        en cours par la suivante ; un seul type d’alerte est donc sélectionné.
      default: siren
      selector:
        select:
          options:
            - label: Sirène (RTTTL)
              value: siren
            - label: Voix (anglais)
              value: speech
          mode: dropdown

    speech_alert_text:
      name: Texte lu par la voix (anglais)
      description: >-
        Phrase anglaise de 512 octets maximum, lue lorsque l’alarme se déclenche
        si Voix (anglais) est sélectionné.
      default: "Warning. Electricity consumption has exceeded the limit."
      selector:
        text: {}

    sound_rtttl:
      name: Mélodie d’alerte (RTTTL)
      description: >-
        Mélodie envoyée directement au TC002 ; aucun fichier audio installé n’est nécessaire.
        Utilisée lorsque Sirène (RTTTL) est le type d’alarme sélectionné.
      default: "siren:d=8,o=6,b=180:a,e,a,e,a,e,a,e"
      selector:
        text: {}

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input power_entity
    id: sensor_update
  - trigger: state
    entity_id: !input percentage_entity
    id: sensor_update
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: time_pattern
    seconds: "/5"
    id: periodic

actions:
  - variables:
      device_filter_choice: !input device_filter
      power_entity_value: !input power_entity
      percentage_entity_value: !input percentage_entity
      test_mode_value: !input test_mode
      app_name_value: !input app_name
      low_threshold_value: !input low_threshold
      high_threshold_value: !input high_threshold
      bar_height_value: !input bar_height
      low_color_choice: !input low_color
      medium_color_choice: !input medium_color
      high_color_choice: !input high_color
      blink_enabled: !input blink_on_overload
      blink_ms_value: !input text_blink_ms
      sound_enabled: !input sound_alert_enabled
      alert_mode_value: !input alert_mode
      speech_alert_text_value: !input speech_alert_text
      sound_rtttl_value: !input sound_rtttl

  - condition: template
    value_template: >-
      {{ (test_mode_value and trigger.id in ['periodic', 'startup'])
         or (not test_mode_value and trigger.id in ['sensor_update', 'startup', 'periodic']) }}

  - variables:
      awtrix_device_value: >-
        {% if device_filter_choice.active_choice == 'Blueforcer uniquement' %}
          {{ device_filter_choice['Blueforcer uniquement'] }}
        {% else %}
          {{ device_filter_choice['Tous les appareils MQTT'] }}
        {% endif %}
      mqtt_prefix: >-
        {% set entities = device_entities(awtrix_device_value)
          | select('search', 'mqtt_prefix') | list %}
        {{ states(entities[0]) if entities else 'unknown' }}
      test_phase: "{{ ((as_timestamp(now()) // 5) | int) % 5 }}"
      effective_power: >-
        {% if test_mode_value %}
          {{ (test_phase | int) * 750 }}
        {% elif is_number(states(power_entity_value)) %}
          {{ states(power_entity_value) | float(0) | round(0) | int }}
        {% else %}
          none
        {% endif %}
      effective_percentage: >-
        {% if test_mode_value %}
          {{ (test_phase | int) * 25 }}
        {% elif is_number(states(percentage_entity_value)) %}
          {{ states(percentage_entity_value) | float(0) }}
        {% else %}
          none
        {% endif %}
      power_display: >-
        {% if effective_power is not none %}
          {{ effective_power | int }}W
        {% else %}
          --W
        {% endif %}
      percentage_display: >-
        {% if effective_percentage is not none %}
          {{ ('%.1f' | format(effective_percentage | float(0))) | replace('.', ',') }}%
        {% else %}
          --%
        {% endif %}
      progress_value: >-
        {% if effective_percentage is not none %}
          {{ [100, [0, (effective_percentage | float(0))] | max] | min | round(0) | int }}
        {% else %}
          0
        {% endif %}
      low_color_hex: >-
        {% set choice = low_color_choice %}
        {% if choice.active_choice == 'Palette RGB' %}
          {% set rgb = choice['Palette RGB'] %}
          {{ '#%02X%02X%02X' | format(rgb[0] | int, rgb[1] | int, rgb[2] | int) }}
        {% else %}
          {{ choice['Hexadécimal'] }}
        {% endif %}
      medium_color_hex: >-
        {% set choice = medium_color_choice %}
        {% if choice.active_choice == 'Palette RGB' %}
          {% set rgb = choice['Palette RGB'] %}
          {{ '#%02X%02X%02X' | format(rgb[0] | int, rgb[1] | int, rgb[2] | int) }}
        {% else %}
          {{ choice['Hexadécimal'] }}
        {% endif %}
      high_color_hex: >-
        {% set choice = high_color_choice %}
        {% if choice.active_choice == 'Palette RGB' %}
          {% set rgb = choice['Palette RGB'] %}
          {{ '#%02X%02X%02X' | format(rgb[0] | int, rgb[1] | int, rgb[2] | int) }}
        {% else %}
          {{ choice['Hexadécimal'] }}
        {% endif %}
      progress_color: >-
        {% set p = effective_percentage | float(0) %}
        {% if p <= low_threshold_value | float(70) %}
          {{ low_color_hex }}
        {% elif p <= high_threshold_value | float(90) %}
          {{ medium_color_hex }}
        {% else %}
          {{ high_color_hex }}
        {% endif %}
      overload_blink: >-
        {{ blink_enabled and effective_percentage is not none
           and (effective_percentage | float(0) >= 100) }}
      safe_app_name: >-
        {{ app_name_value | lower | regex_replace('[^a-z0-9_-]', '_') | truncate(32, true, '') }}

  - condition: template
    value_template: >-
      {{ mqtt_prefix not in ['unknown', 'unavailable', 'none', ''] }}

  - action: mqtt.publish
    data:
      topic: "{{ mqtt_prefix }}/cmd/apps/pushed/{{ safe_app_name }}"
      qos: 0
      retain: false
      payload: >-
        {% set blink = (blink_ms_value | int(600)) if overload_blink else 0 %}
        {{ {
          "layout": {
            "version": 1,
            "backgroundColor": "#000000",
            "regions": [
              {
                "id": "icon_lightningbolt",
                "box": [0, 0, 8, 14 - (bar_height_value | int(4))],
                "icon": "lightningbolt",
                "align": "center",
                "valign": "center"
              },
              {
                "id": "power",
                "box": [9, 0, 20, 14 - (bar_height_value | int(4))],
                "text": power_display | trim,
                "color": "#FFFFFF",
                "align": "center",
                "valign": "center",
                "scroll": {
                  "mode": "loop",
                  "direction": "left",
                  "whenFits": "static",
                  "speed": 70,
                  "gap": 4,
                  "holdMs": 700
                },
                "textBlinkMs": blink
              },
              {
                "id": "percentage",
                "box": [30, 0, 22, 14 - (bar_height_value | int(4))],
                "text": percentage_display | trim,
                "color": progress_color,
                "align": "center",
                "valign": "center",
                "scroll": {
                  "mode": "loop",
                  "direction": "left",
                  "whenFits": "static",
                  "speed": 70,
                  "gap": 4,
                  "holdMs": 700
                },
                "textBlinkMs": blink
              },
              {
                "id": "progress_border",
                "box": [0, 14 - (bar_height_value | int(4)), 52, (bar_height_value | int(4)) + 2],
                "draw": [["rect", 0, 0, 52, (bar_height_value | int(4)) + 2, "#A0A0A0"]]
              },
              {
                "id": "progress",
                "box": [
                  1,
                  15 - (bar_height_value | int(4)),
                  50,
                  bar_height_value | int(4)
                ],
                "progress": progress_value | int(0),
                "color": progress_color,
                "trackColor": "#202020"
              }
            ]
          }
        } | to_json }}

  # Modo real: suena solo al cruzar desde menos del 100 % hasta el 100 % o más.
  # Mode test: reproduce el sonido al llegar al paso simulado del 100 %.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ sound_enabled and (
                   (test_mode_value and trigger.id == 'periodic'
                    and (test_phase | int) == 4)
                   or
                   (not test_mode_value and trigger.id == 'sensor_update'
                    and trigger.entity_id == percentage_entity_value
                    and trigger.from_state is not none
                    and trigger.to_state is not none
                    and is_number(trigger.from_state.state)
                    and is_number(trigger.to_state.state)
                    and (trigger.from_state.state | float(0) < 100)
                    and (trigger.to_state.state | float(0) >= 100))
                 ) }}
        sequence:
          - action: mqtt.publish
            data:
              topic: "{{ mqtt_prefix }}/cmd/audio/play"
              qos: 0
              retain: false
              payload: >-
                {%- if alert_mode_value == 'speech' -%}{{ {'speech': speech_alert_text_value | trim} | to_json }}{%- else -%}{{ {'rtttl': sound_rtttl_value} | to_json }}{%- endif -%}
